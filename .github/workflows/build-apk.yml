name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le site (dossier www)
        run: |
          mkdir www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='android' --exclude='node_modules' \
            --exclude='*.yml' --exclude='icon.png' \
            ./ www/
          ls -la www

      - name: Installer Capacitor et créer le projet Android
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Télescope Mahfoud" com.mahmoh1960.telescope --web-dir www
          npx cap add android
          npx cap sync android

      - name: Autoriser la caméra
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Icône de l'application (icon.png)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f icon.png ]; then
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
              cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
              rm -f $R/mipmap-$d/ic_launcher_foreground.png
            done
          else
            echo "icon.png absent : icône par défaut"
          fi

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: telescope-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
